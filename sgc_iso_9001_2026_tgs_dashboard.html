        // Filter and Search Functionality
        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const data = database[currentTab];

            const filtered = data.filter(item => {
                // Category Filter Check
                let catMatch = true;
                if (category !== 'ALL') {
                    if (currentTab === 'contexto') catMatch = item.tipo === category;
                    if (currentTab === 'entradas') catMatch = item.tipo === category;
                    if (currentTab === 'procesos') catMatch = item.subsistema === category;
                    if (currentTab === 'salidas') catMatch = item.tipo === category;
                    if (currentTab === 'ciclo') catMatch = item.fase === category;
                    if (currentTab === 'riesgos') catMatch = item.concepto === category;
                }

                // Search Query Check across all values
                const searchMatch = Object.values(item).some(val => 
                    String(val).toLowerCase().includes(query)
                );

                return catMatch && searchMatch;
            });

            renderTable(filtered);
        }

        // Interactive Chart Rendering (Chart.js)
        function renderChart(tabKey) {
            const ctx = document.getElementById('dashboardChart').getContext('2d');
            const data = database[tabKey];
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#cbd5e1' : '#334155';

            let counts = {};
            let labelTitle = '';

            if (tabKey === 'contexto') {
                labelTitle = 'Tipos de Factores';
                data.forEach(d => counts[d.tipo] = (counts[d.tipo] || 0) + 1);
            } else if (tabKey === 'entradas') {
                labelTitle = 'Tipos de Recursos';
                data.forEach(d => counts[d.tipo] = (counts[d.tipo] || 0) + 1);
            } else if (tabKey === 'procesos') {
                labelTitle = 'Subsistemas de la Empresa';
                data.forEach(d => counts[d.subsistema] = (counts[d.subsistema] || 0) + 1);
            } else if (tabKey === 'salidas') {
                labelTitle = 'Tipos de Entregables/Salidas';
                data.forEach(d => counts[d.tipo] = (counts[d.tipo] || 0) + 1);
            } else if (tabKey === 'ciclo') {
                labelTitle = 'Fases del Ciclo PHVA';
                data.forEach(d => counts[d.fase] = (counts[d.fase] || 0) + 1);
            } else if (tabKey === 'riesgos') {
                labelTitle = 'Conceptos Teoria Sistémica';
                data.forEach(d => counts[d.concepto] = (counts[d.concepto] || 0) + 1);
            }

            const labels = Object.keys(counts);
            const datasetValues = Object.values(counts);

            // Destroy previous chart instance
            if (chartInstance) {
                chartInstance.destroy();
            }

            const chartColors = [
                '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', 
                '#06b6d4', '#6366f1', '#84cc16', '#f97316', '#14b8a6'
            ];

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: datasetValues,
                        backgroundColor: chartColors.slice(0, labels.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: textColor,
                                font: { size: 11 }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });

            // Update Summary Note
            document.getElementById('chartSummary').innerHTML = `
                <strong>Resumen de ${labelTitle}:</strong> El módulo cuenta con <strong>${data.length} elementos</strong> divididos en <strong>${labels.length} categorías principales</strong> para el control sistémico ISO 9001:2026.
            `;
        }

        // Modal View Open Handler
        function openModal(id) {
            const data = database[currentTab];
            const record = data.find(r => r.id === id);

            if (!record) return;

            document.getElementById('modalID').innerText = record.id;
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            // Mapping property labels
            const labelsMap = {
                id: 'Identificador Unico (ID)',
                tipo: 'Tipo / Categoría',
                parte: 'Parte Interesada',
                expectativa: 'Expectativa / Requisito ISO',
                alcance: 'Límites de Alcance',
                insumo: 'Insumo o Elemento de Entrada',
                requisito: 'Requisito de Entrada',
                competencia: 'Criterio / Competencia Metrológica',
                nombre: 'Nombre del Proceso',
                subsistema: 'Subsistema / Ámbito de Aplicación',
                actividades: 'Actividades Clave Desarrolladas',
                cultura: 'Cultura y Comportamiento Ético',
                producto: 'Producto, Servicio o Resultado',
                valor: 'Valor Agregado Sistémico',
                metrica: 'Métrica de Satisfacción / KPI',
                fase: 'Fase PHVA',
                esperado: 'Resultado Esperado (Plan/Meta)',
                obtenido: 'Resultado Obtenido (Real)',
                accion: 'Desviación o Acción Tomada',
                concepto: 'Concepto Teoría General de Sistemas (TGS)',
                riesgo: 'Riesgo u Oportunidad Detectada',
                medida: 'Medida de Control Implementada',
                clausula: 'Cláusula / Numeral ISO 9001:2026',
                fecha: 'Fecha de Registro / Revisión'
            };

            Object.keys(record).forEach(key => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'border-b border-slate-100 dark:border-slate-700/50 pb-2';
                itemDiv.innerHTML = `
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">${labelsMap[key] || key}</span>
                    <p class="text-sm font-medium text-slate-800 dark:text-slate-100 mt-0.5">${record[key]}</p>
                `;
                modalBody.appendChild(itemDiv);
            });

            // Show Slide-Over Modal
            const modal = document.getElementById('detailModal');
            const panel = document.getElementById('modalPanel');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            panel.classList.remove('translate-x-full');
        }

        // Close Modal Handler
        function closeModal() {
            const modal = document.getElementById('detailModal');
            const panel = document.getElementById('modalPanel');
            modal.classList.add('opacity-0', 'pointer-events-none');
            panel.classList.add('translate-x-full');
        }

        // Keyboard Escape Key Listener for Modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Initialize App on DOM Load
        window.onload = function () {
            switchTab('contexto');
        };
    </script>
</body>
</html>
